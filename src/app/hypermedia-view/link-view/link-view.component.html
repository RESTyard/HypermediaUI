<div class="container">
  @for (link of links; track link) {
    <span class="link-group">
      <a mat-flat-button class="main-link-button"
         [href]="getBrowserUrl(link)"
         (click)="$event.preventDefault(); navigateLink(link)">
        @if (getRelationIcon(link.relations)) {
          <mat-icon>{{getRelationIcon(link.relations)}}</mat-icon>
        } @else {
          <mat-icon>link</mat-icon>
        }
        <span>
          {{link.relations.join(',')}}
        </span>
      </a>
      <button mat-flat-button class="dropdown-button" [matMenuTriggerFor]="dropdownMenuOne">
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #dropdownMenuOne="matMenu">
        <div class="menu-url-container" (click)="$event.stopPropagation()">
          <button mat-icon-button
                  (click)="copyToClipBoard(link)"
                  matTooltip="copy to clipboard"
                  color="primary">
            <mat-icon>assignment</mat-icon>
          </button>
          <span class="url-text">{{link.url}}</span>
        </div>
        <mat-divider></mat-divider>
        @if (link.type !== MediaTypes.Siren && link.type != undefined) {
          <button  mat-menu-item
            (click)="download(link)">
            <mat-icon color="primary">download</mat-icon>
            Download
          </button>
        }
      </mat-menu>
    </span>
  }
</div>
