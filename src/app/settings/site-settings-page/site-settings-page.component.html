

<app-site-settings [siteSetting]="siteSettings.globalSiteSettings" [urlEditable]="false" [isGlobal]="true"
headline="Global" [canBeDeleted]="false"></app-site-settings>
@for (site of sites; track site.id) {
  <app-site-settings [siteSetting]="site.setting" [siteUrls]="siteUrls"
                     (siteUrlChanging)="renameSiteId($event)"
                     (deleteRequested)="removeSite(site.setting.siteUrl)"></app-site-settings>
}

<div class="toolbar">
  <button id="addButton" mat-raised-button color="primary" type="button" (click)="addSite()">
    <mat-icon>add_circle_outline</mat-icon>
    Add site
  </button>
</div>
